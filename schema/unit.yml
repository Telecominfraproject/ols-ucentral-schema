description:
  A device has certain properties that describe its identity and location.
  These properties are described inside this object.
type: object
properties:
  name:
    description:
      This is a free text field, stating the administrative name of the
      device. It may contain spaces and special characters.
    type: string
  hostname:
    description:
      The hostname that shall be set on the device. If this field is not set,
      then the devices serial number is used.
    type: string
    format: hostname
  location:
    description:
      This is a free text field, stating the location of the  device. It
      may contain spaces and special characters.
    type: string
  timezone:
    description:
      This allows you to change the TZ of the device.
    type: string
    examples:
    - UTC
    - EST5
    - CET-1CEST,M3.5.0,M10.5.0/3
  leds-active:
    description:
      This allows forcing all LEDs off.
    type: boolean
    default: true
  random-password:
    description:
      The device shall create a random root password and tell the gateway about it.
    type: boolean
    default: false
  system-password:
    description:
      System-config string that holds the password for main (root / admin) user to apply.
    type: string
  beacon-advertisement:
    description:
      The TIP vendor IEs that shall be added to beacons
    type: object
    properties:
      device-name:
        description:
          Add an IE containing the device's name to beacons.
        type: boolean
      device-serial:
        description:
          Add an IE containing the device's serial to beacons.
        type: boolean
      network-id:
        description:
          A provider specific ID for the network/venue that the device is part of.
        type: integer
  poe:
    description:
      This section describes the system-wide (unit) PoE controller configuration object.
    type: object
    properties:
      power-management:
        description:
          This configuration mode controls the power management algorithm used by the Power sourcing equipment to deliver
          power to the requesting PDs.
          "class" option - Class-based power management.
          "dynamic" option - Power management is done by the POE controller and the maximum power for a
          port is not reserved for each port.
          "static" option - The power deducted from the total power pool is the maximum power for that port.
          This mode ensures that the maximum power specified by you for the interface is always reserved and
          cannot be shared by other PDs.
        type: string
        examples:
          - "class"
          - "dynamic"
          - "dynamic-priority"
          - "static"
          - "static-priority"
      usage-threshold:
        description:
          Configure a power alarm threshold for the Power sourcing equipment (in percentages %).
        type: number
        default: 90
      scheduling-profiles:
        description:
          List of system-wide PoE scheduling profiles. Each profile is a named
          time window that can be referenced by PoE ports
          (ethernet.poe.scheduling.profiles). During the time window of a profile
          referenced by a port, PoE power is delivered on that port; outside of
          all referenced time windows, PoE power is turned off.
          Times are evaluated in the device local time (see unit.timezone).
          A profile normally uses either the absolute time window or the periodic
          time window. If both are set in the same profile, they are treated
          independently, without merging, and the profile is active whenever
          either window's condition is met.
        type: array
        items:
          type: object
          required:
            - name
          properties:
            name:
              description:
                Unique name of the scheduling profile. Referenced by
                ethernet.poe.scheduling.profiles.
              type: string
              minLength: 1
              maxLength: 32
              examples:
                - schedule1
            absolute-start-time:
              description:
                Absolute (one-time) start date and time of the profile,
                in the format "YYYY-MM-DD HH:MM". Empty string means not used.
              type: string
              pattern: "^$|^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]$"
              examples:
                - "2026-12-24 00:00"
            absolute-end-time:
              description:
                Absolute (one-time) end date and time of the profile,
                in the format "YYYY-MM-DD HH:MM". Empty string means not used.
              type: string
              pattern: "^$|^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]$"
              examples:
                - "2026-12-26 00:00"
            periodic-weekdays:
              description:
                Days of the week on which the periodic time window applies.
              type: array
              uniqueItems: true
              items:
                type: string
                enum:
                  - Mon
                  - Tue
                  - Wed
                  - Thu
                  - Fri
                  - Sat
                  - Sun
              examples:
                - [ "Wed", "Thu", "Fri" ]
            periodic-start-time:
              description:
                Daily start time of the periodic window, in the format "HH:MM".
                The periodic window is defined per day within 00:00-24:00 and
                must not cross midnight, so periodic-start-time must be earlier
                than periodic-end-time. A window spanning midnight must be
                configured as separate profiles (e.g. 22:00-24:00 and 00:00-06:00).
                Empty string means not used.
              type: string
              pattern: "^$|^([01][0-9]|2[0-3]):[0-5][0-9]$"
              examples:
                - "00:00"
            periodic-end-time:
              description:
                Daily end time of the periodic window, in the format "HH:MM".
                "24:00" means the end of the day (midnight).
                Empty string means not used.
              type: string
              pattern: "^$|^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$"
              examples:
                - "12:00"
  multicast:
    description:
      This sections describes the system-wide (unit) multicast configuration object.
    type: object
    properties:
      igmp-snooping-enable:
        description:
          Global config for controlling whether IGMP snooping is enabled. If this global setting is disabled, all VLANs are treated as disabled, whether they are enabled or not.
        type: boolean
        default: true
      mld-snooping-enable:
        description:
          Global config for controlling whether MLD snooping is enabled. If this global setting is disabled, all VLANs are treated as disabled, whether they are enabled or not.
        type: boolean
        default: true
      unknown-multicast-flood-control:
        description:
          Global config for the unknown multicast flood control feature. This enables the system to forward unknown multicast packets only to a multicast router (mrouter).
        type: boolean
        default: false
      querier-enable:
        description:
          Global IGMP querier config. This enables all Vlan interfaces to act as a querier.
        type: boolean
        default: false
