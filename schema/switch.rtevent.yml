description: Configuration for enabling or disabling specific event categories and their sub-events.
type: object
properties:
  port-status:
    description: Enable/Disable Port Status events.
    type: object
    properties:
      enabled:
        description: Enable/Disable Port Status category.
        type: boolean
        default: false
      sub-events:
        type: object
        properties:
          wired.carrier-down:
            type: boolean
            description: Enable/Disable carrier down event.
            default: false
          wired.carrier-up:
            type: boolean
            description: Enable/Disable carrier up event.
            default: false
  module:
    description: Enable/Disable Module events.
    type: object
    properties:
      enabled:
        type: boolean
        description: Enable/Disable Module category.
        default: false
      sub-events:
        type: object
        properties:
          module.plugout:
            type: boolean
            description: Enable/Disable module plugout event.
            default: false
          module.plugin:
            type: boolean
            description: Enable/Disable module plugin event.
            default: false
  stp:
    description: Enable/Disable STP events.
    type: object
    properties:
      enabled:
        type: boolean
        description: Enable/Disable STP category.
        default: false
      sub-events:
        type: object
        properties:
          stp.loop-detected:
            type: boolean
            description: Enable/Disable loop detected event.
            default: false
          stp.loop-cleared:
            type: boolean
            description: Enable/Disable loop cleared event.
            default: false
          stp.state-change:
            type: boolean
            description: Enable/Disable state change event.
            default: false
  rstp:
    description: Enable/Disable RSTP events.
    type: object
    properties:
      enabled:
        type: boolean
        description: Enable/Disable RSTP category.
        default: false
      sub-events:
        type: object
        properties:
          rstp.loop-detected:
            type: boolean
            description: Enable/Disable loop detected event.
            default: false
          rstp.loop-cleared:
            type: boolean
            description: Enable/Disable loop cleared event.
            default: false
          rstp.state-change:
            type: boolean
            description: Enable/Disable state change event.
            default: false
  fw-upgrade:
    description: Enable/Disable Firmware Upgrade events.
    type: object
    properties:
      enabled:
        type: boolean
        description: Enable/Disable Firmware Upgrade category.
        default: false
      sub-events:
        type: object
        properties:
          upg.download-start:
            type: boolean
            description: Enable/Disable download start event.
            default: false
          upg.download-in-progress:
            type: boolean
            description: Enable/Disable download in progress event.
            default: false
          upg.download-failed:
            type: boolean
            description: Enable/Disable download failed event.
            default: false
          upg.validation-start:
            type: boolean
            description: Enable/Disable validation start event.
            default: false
          upg.validation-success:
            type: boolean
            description: Enable/Disable validation success event.
            default: false
          upg.validation-failed:
            type: boolean
            description: Enable/Disable validation failed event.
            default: false
          upg.backup-current-firmware:
            type: boolean
            description: Enable/Disable firmware backup event.
            default: false
          upg.install-start:
            type: boolean
            description: Enable/Disable install start event.
            default: false
          upg.install-failed:
            type: boolean
            description: Enable/Disable install failed event.
            default: false
          upg.reboot-start:
            type: boolean
            description: Enable/Disable reboot start event.
            default: false
          upg.success:
            type: boolean
            description: Enable/Disable upgrade success event.
            default: false
  dhcp-snooping:
    description: Enable/Disable DHCP Snooping events.
    type: object
    properties:
      enabled:
        type: boolean
        description: Enable/Disable DHCP Snooping category.
        default: false
      sub-events:
        type: object
        properties:
          dhcp-snooping.violation-detected:
            type: boolean
            description: Enable/Disable DHCP Snooping violation detected event.
            default: false
          dhcp-snooping.violation-cleared:
            type: boolean
            description: Enable/Disable DHCP Snooping violation cleared event.
            default: false
  poe-status:
    description: Enable/Disable PoE Status events reporting the operational state of PSE port PD detection.
    type: object
    properties:
      enabled:
        type: boolean
        description: Enable/Disable PoE Status category.
        default: false
      sub-events:
        type: object
        properties:
          wired.poe.status.disabled:
            type: boolean
            description: Enable/Disable event indicating PSE State is DISABLED (PoE disabled on port by configuration).
            default: false
          wired.poe.status.searching:
            type: boolean
            description: Enable/Disable event indicating PSE is in an intermediate state searching for a powered device.
            default: false
          wired.poe.status.delivering_power:
            type: boolean
            description: Enable/Disable event indicating PSE State is POWER_ON and a powered device is receiving power.
            default: false
          wired.poe.status.fault:
            type: boolean
            description: Enable/Disable event indicating PSE State is IDLE due to internal error conditions preventing power delivery.
            default: false
          wired.poe.status.overload:
            type: boolean
            description: Enable/Disable event indicating PSE State is OVERLOAD.
            default: false
  poe-fault:
    description: Enable/Disable PoE Fault events reporting the specific error condition when a PSE port is in fault status.
    type: object
    properties:
      enabled:
        type: boolean
        description: Enable/Disable PoE Fault category.
        default: false
      sub-events:
        type: object
        properties:
          wired.poe.fault.ovlo:
            type: boolean
            description: Enable/Disable event indicating the port has detected an over voltage lockout condition.
            default: false
          wired.poe.fault.mps_absent:
            type: boolean
            description: Enable/Disable event indicating the PSE port has detected an absence of Maintain Power Signature (MPS).
            default: false
          wired.poe.fault.short:
            type: boolean
            description: Enable/Disable event indicating the PSE port has detected a short circuit condition.
            default: false
          wired.poe.fault.overload:
            type: boolean
            description: Enable/Disable event indicating the connected PD attempted to draw more power than permissible by hardware.
            default: false
          wired.poe.fault.power_denied:
            type: boolean
            description: Enable/Disable event indicating the powered device port was denied power due to power shortage or administrative action.
            default: false
          wired.poe.fault.thermal_shutdown:
            type: boolean
            description: Enable/Disable event indicating the thermal threshold has been exceeded for the PSE port.
            default: false
          wired.poe.fault.startup_failure:
            type: boolean
            description: Enable/Disable event indicating the port does not have sufficient voltage to start up.
            default: false
          wired.poe.fault.uvlo:
            type: boolean
            description: Enable/Disable event indicating the port has detected an under voltage lockout condition.
            default: false
          wired.poe.fault.hw_pin_disable:
            type: boolean
            description: Enable/Disable event indicating the hardware disable-all-ports pin is active.
            default: false
          wired.poe.fault.port_undefined:
            type: boolean
            description: Enable/Disable event indicating the port is not mapped to a physical port and is in an unknown state.
            default: false
          wired.poe.fault.internal_hw_fault:
            type: boolean
            description: Enable/Disable event indicating the port does not respond due to a communication failure.
            default: false
          wired.poe.fault.user_setting:
            type: boolean
            description: Enable/Disable event indicating the port was disabled by a user command.
            default: false
          wired.poe.fault.non_standard_pd:
            type: boolean
            description: Enable/Disable event indicating a non-802.3AF/AT powered device is connected.
            default: false
          wired.poe.fault.underload:
            type: boolean
            description: Enable/Disable event indicating the connected PD attempted to draw less power than permissible by hardware.
            default: false
          wired.poe.fault.pwr_budget_exceeded:
            type: boolean
            description: Enable/Disable event indicating the power management function shut down the port due to insufficient power budget.
            default: false
          wired.poe.fault.oor_capacitor_value:
            type: boolean
            description: Enable/Disable event indicating power sourcing failed due to an out-of-range capacitor value.
            default: false
          wired.poe.fault.class_error:
            type: boolean
            description: Enable/Disable event indicating power sourcing failed because the powered device requested an illegal power class.
            default: false
  # Continue similarly for ARP Inspection, IPSG, and Device Events.
