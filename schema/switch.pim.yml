description: Global PIM-SM (Protocol Independent Multicast – Sparse Mode) configuration for the switch.
type: object
properties:
  spt-threshold:
    description: Controls when a first-hop router switches from the shared tree to the shortest-path tree.
    type: object
    properties:
      infinity:
        description: When true, the router never switches to the shortest-path tree and always uses the shared tree via the RP.
        type: boolean
        default: false
      group-prefix:
        description: Restrict SPT-threshold infinity behaviour to a specific multicast group prefix.
        type: object
        properties:
          address:
            description: IPv4 multicast group network address.
            type: string
            format: ipv4
            examples:
            - 239.0.0.0
          mask:
            description: Subnet mask for the multicast group prefix.
            type: string
            format: ipv4
            examples:
            - 255.0.0.0
  ssm-ranges:
    description: Source-Specific Multicast (SSM) address range configuration.
    type: object
    properties:
      address:
        description: Starting IPv4 multicast group address for the SSM range.
        type: string
        format: ipv4
        examples:
        - 232.0.0.0
      mask:
        description: Subnet mask for the SSM address range.
        type: string
        format: ipv4
        examples:
        - 255.0.0.0
  rendezvous-points:
    description: List of PIM Rendezvous Point (RP) addresses and their associated group prefixes.
    type: array
    items:
      type: object
      properties:
        address:
          description: IPv4 address of the Rendezvous Point.
          type: string
          format: ipv4
          examples:
          - 10.0.0.1
        group-prefix:
          description: Multicast group prefix served by this RP. If omitted, the RP serves all groups.
          type: object
          properties:
            address:
              description: IPv4 multicast group network address.
              type: string
              format: ipv4
              examples:
              - 224.0.0.0
            mask:
              description: Subnet mask for the multicast group prefix.
              type: string
              format: ipv4
              examples:
              - 240.0.0.0
      required:
      - address
